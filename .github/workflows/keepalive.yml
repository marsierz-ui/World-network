name: Keep Supabase awake

# Free-tier projects pause after ~7 days of inactivity. Ping every 3 days so the
# app is never cold when you open it on your phone.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST \
            "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "HTTP $code"; cat /tmp/out.txt
          test "$code" = "200"
