project_id = "world-network"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Google OAuth — set GOOGLE_CLIENT_ID / GOOGLE_SECRET in your environment.
# Enable the People API in that Cloud project, and request the read/write contacts scope.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[functions.google-token]
# Keeps the Google connection alive by exchanging the stored refresh token.
# verify_jwt stays on: the function reads and writes the caller's own row.
verify_jwt = true

[storage]
enabled = true
